# Build every example with GCC and with clang (ch32rv-toolchain) and compare
# the sizes. The report is the run's summary; the CSVs are in the artifacts.
name: Toolchain size comparison

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "ch32fun ref built unchanged with GCC as the baseline"
        default: master
      clang_version:
        description: "ch32rv-toolchain release (without the leading v)"
        default: 23.1.5-3
  push:
    branches: [clang-toolchain]

env:
  BASELINE_REF: ${{ inputs.baseline_ref || 'master' }}
  CLANG_VERSION: ${{ inputs.clang_version || '23.1.5-3' }}
  # The GCC packages, fetched from the Ubuntu mirror once and then cached:
  # a slow mirror stalled the GCC jobs when each of them ran apt-get.
  GCC_DEBS_KEY: gcc-debs-ubuntu-24.04-1
  GCC_PACKAGES: make libnewlib-dev gcc-riscv64-unknown-elf
  APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  gcc-debs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: gcc-debs
          key: ${{ env.GCC_DEBS_KEY }}
      - name: Download the GCC packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p gcc-debs/partial
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends --download-only \
            -o Dir::Cache::archives="$PWD/gcc-debs" $GCC_PACKAGES
          sudo rm -rf gcc-debs/partial gcc-debs/lock
          sudo chown -R "$USER" gcc-debs
          ls -l gcc-debs

  build:
    needs: gcc-debs
    # clang does not need the packages; GCC falls back to the mirror
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ch32fun as it is (baseline_ref), GCC: -Os -flto
          - { name: gcc-master, baseline: true, toolchain: "", opt: "", extra: "" }
          # this branch, GCC: gcc should match gcc-master byte for byte.
          # (GCC 13's -Oz gave the same bytes as -Os on every example.)
          - { name: gcc, baseline: false, toolchain: gcc, opt: "", extra: "" }
          - { name: gcc-Os-sr, baseline: false, toolchain: gcc, opt: "-Os -flto -msave-restore", extra: "" }
          # clang: ch32fun's level, then the Arduino core's default (-Oz -flto
          # with XW where the core has it) and its smallest (+ -msave-restore)
          - { name: clang-Os, baseline: false, toolchain: clang, opt: "-Os -flto", extra: "XW=0" }
          - { name: clang-Oz, baseline: false, toolchain: clang, opt: "-Oz -flto", extra: "XW=0" }
          - { name: clang-Oz-xw, baseline: false, toolchain: clang, opt: "-Oz -flto", extra: "XW=1" }
          - { name: clang-Oz-xw-sr, baseline: false, toolchain: clang, opt: "-Oz -flto -msave-restore", extra: "XW=1" }
          # V00x with clang_rt's division instead of misc/libgcc.a's
          - { name: clang-Oz-xw-rt, baseline: false, toolchain: clang, opt: "-Oz -flto", extra: "XW=1 MISC_LIBGCC=0" }
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ matrix.baseline && env.BASELINE_REF || github.sha }}

      - uses: actions/cache/restore@v4
        if: matrix.toolchain != 'clang'
        with:
          path: gcc-debs
          key: ${{ env.GCC_DEBS_KEY }}
      - name: GCC
        if: matrix.toolchain != 'clang'
        timeout-minutes: 10
        run: |
          sudo apt-get -yqq purge man-db || true
          # from the cache; the mirror only if the packages do not install
          if ! sudo dpkg -i gcc-debs/*.deb; then
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y --no-install-recommends $GCC_PACKAGES
          fi
          riscv64-unknown-elf-gcc --version | head -1
          for t in size objcopy nm; do echo "${t^^}=riscv64-unknown-elf-$t" >> "$GITHUB_ENV"; done

      - name: clang (ch32rv-toolchain ${{ env.CLANG_VERSION }})
        if: matrix.toolchain == 'clang'
        timeout-minutes: 10
        run: |
          f=ch32rv-toolchain-$CLANG_VERSION-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/ch32-riscv-ug/ch32rv-toolchain/releases/download/v$CLANG_VERSION
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 5 "$base/$f" && curl -fsSLO --retry 5 "$base/$f.sha256"
          sha256sum -c "$f.sha256"
          tar -xzf "$f"
          bin=$RUNNER_TEMP/ch32rv-toolchain/bin
          "$bin/clang" --version | head -1
          echo "CLANG_BIN=$bin/" >> "$GITHUB_ENV"
          for t in size objcopy nm; do echo "${t^^}=$bin/llvm-$t" >> "$GITHUB_ENV"; done

      - name: Build all examples
        run: |
          args=()
          [ -n "${{ matrix.toolchain }}" ] && args+=("TOOLCHAIN=${{ matrix.toolchain }}")
          [ -n "${{ matrix.opt }}" ] && args+=("OPT=${{ matrix.opt }}")
          [ "${{ matrix.toolchain }}" = clang ] && args+=("CLANG_BIN=$CLANG_BIN")
          read -ra extra <<< "${{ matrix.extra }}"
          args+=("${extra[@]}")
          tools/misc/toolchain_compare/build.sh src "${{ matrix.name }}" out "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ matrix.name }}
          path: out

  report:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sizes-*
          path: results
      - name: Report
        run: |
          python3 misc/toolchain_compare/report.py gcc-master report results/*/sizes.csv
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report
